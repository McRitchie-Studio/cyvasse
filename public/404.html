<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found · Cyvasse</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.png" type="image/png">
  <!-- The last resort (task apps-adopt-not-found-page; studio-engine
       docs/NOT_FOUND_PAGE.md). The friendly not-found page is the engine's
       Studio::ExceptionsApp, inside this app's layout. This file answers when
       that page cannot render (an old browser allow_browser turns away, a
       redirect, an error), so it stands alone: no script, no stylesheet, no
       font to fetch, only files already in public/. Same words and the same
       data-test hooks as the engine page.
       Parchment gold over the board art (public/cyvasse-404-background.jpg, a small copy of app/assets/images/backgrounds/cyvasse_404_background.png). The button is the gold deepened so its white label reads (5.0:1).
       Plain colour values, no custom properties, so an old browser reads it. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background-color: #EFE7D6;
      background-image: linear-gradient(rgba(239, 231, 214, 0.82), rgba(239, 231, 214, 0.82)), url("/cyvasse-404-background.jpg");
      background-size: cover;
      background-position: center;
      color: #5A4A35;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 28rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      background: #FFFDF7;
      border: 1px solid #E2D3B0;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(43, 33, 21, 0.25);
    }
    img { display: block; width: 4rem; height: 4rem; margin: 0 auto 1.5rem; object-fit: contain; }
    .eyebrow {
      margin: 0 0 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #8A6118;
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.75rem; font-weight: 800; line-height: 1.2; color: #2B2115; }
    p.message { margin: 0 0 2rem; font-size: 1rem; }
    a.home {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      background: #94661C;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
    }
    a.home:hover { background: #7A5416; }
    a.home:focus-visible { outline: 2px solid #94661C; outline-offset: 3px; }
    @media (min-width: 640px) { a.home { width: auto; } }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #17130D;
        background-image: linear-gradient(rgba(23, 19, 13, 0.86), rgba(23, 19, 13, 0.86)), url("/cyvasse-404-background.jpg");
        color: #D9CBB0;
      }
      main { background: #211B13; border-color: #4A3C25; }
      .eyebrow { color: #E0B25C; }
      h1 { color: #F7EEDC; }
      a.home { background: #94661C; }
      a.home:hover { background: #A87420; }
      a.home:focus-visible { outline-color: #E0B25C; }
    }
  </style>
</head>
<body data-static-404>
  <main data-test="not-found" aria-labelledby="not-found-title">
    <img src="/icon.png" alt="Cyvasse" width="64" height="64">
    <p class="eyebrow">404 &middot; Not found</p>
    <h1 id="not-found-title">This page isn’t here</h1>
    <p class="message">The address may be mistyped, or the page may have moved. Head back home and pick up from there.</p>
    <a class="home" href="/" data-test="not-found-home">Back to Cyvasse</a>
  </main>
</body>
</html>
