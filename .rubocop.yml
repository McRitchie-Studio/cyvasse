# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# db/schema.rb is generated by every migration, and the engine's migrations are copied verbatim by studio_engine:install:migrations
# (the release does this when it bumps the engine). Restyling them would be undone
# on the next copy, so they keep the engine's style. Same rule as voicebox and
# alex-build. `merge` keeps RuboCop's default excludes (vendor/, node_modules/).
inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - "db/schema.rb"
    - "db/migrate/*.studio_engine.rb"
