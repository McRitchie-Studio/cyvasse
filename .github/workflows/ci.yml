name: CI

on:
  pull_request:
  push:
    # Every rung of the ladder earns its own verdict: review merges several PRs
    # onto `accepted` (a combination nothing else executes), and `bin/release
    # prepare` refuses to promote a RED `accepted`, which it can only do if this
    # workflow builds that branch. Guarded by test/lib/ci_workflow_test.rb.
    branches: [ main, release, accepted ]

# No `concurrency:` block, deliberately: a cancelled run's conclusion is
# `cancelled`, which the release tooling folds as RED, and back-to-back pushes
# to `accepted` are normal. (mcritchie-studio's ci.yml carries the argument.)

# ONE JOB, AND IT IS A CALL. The lanes live in the hub's reusable-ci.yml and
# check out this repo, so every script they run is this repo's own. GitHub
# names each check `ci / <lane>`: `ci / static`, `ci / javascript`,
# `ci / system`. test/lib/ci_workflow_test.rb pins the call and every input.
#
# - static: brakeman, bundler-audit, importmap audit and rubocop, in one job.
# - javascript: the game engine's unit tests (bin/test-js).
# - system: the whole Rails suite, unit, integration and system, in one
#   command, after the Tailwind build the integration pages link.
#
# Postgres is the mirror's 18, production's major (heroku pg:info).
jobs:
  ci:
    uses: McRitchie-Studio/mcritchie-studio/.github/workflows/reusable-ci.yml@main
    with:
      island-animator: false
      playwright: false
      rails-shards: false
      await-gem-propagation: false
      postgres-image: public.ecr.aws/docker/library/postgres:18
      gem-audit-command: bin/bundler-audit
      importmap-audit-command: bin/importmap audit
      system-packages: libpq-dev libvips postgresql-client
      system-setup-command: bin/rails tailwindcss:build
      system-command: bin/rails db:test:prepare test test:system
